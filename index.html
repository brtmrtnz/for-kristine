<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For Kristine ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#fff6f8;
      --bg2:#f7f9ff;
      --accent:#ff6b81;
      --muted:#6b7280;
      --card:#ffffff;
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(120deg,var(--bg1),var(--bg2));
      display:flex;align-items:center;justify-content:center;padding:28px;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }

    .wrap{width:100%;max-width:820px;background:var(--card);border-radius:22px;box-shadow:0 20px 50px rgba(20,20,30,0.08);overflow:hidden}

    header{padding:36px 34px 18px;background:linear-gradient(180deg,rgba(255,107,129,0.06),transparent);display:flex;align-items:center;gap:18px}
    .title{flex:1}
    h1{margin:0;font-family:'Dancing Script',cursive;font-size:34px;color:#222}
    p.sub{margin:6px 0 0;color:var(--muted);font-size:14px}

    main{padding:28px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(250,250,250,0.9));border-radius:14px;padding:28px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}

    .reason{font-size:20px;text-align:center;line-height:1.45;color:#222;max-width:720px;opacity:0;transform:translateY(12px);transition:all 520ms cubic-bezier(.2,.9,.3,1)}
    .reason.show{opacity:1;transform:translateY(0)}

    .controls{display:flex;gap:12px;margin-top:18px}
    button.btn{background:var(--accent);color:white;border:0;padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(255,107,129,0.18)}
    button.ghost{background:transparent;color:var(--accent);border:1px solid rgba(255,107,129,0.12)}

    .progress{height:8px;background:linear-gradient(90deg,rgba(255,107,129,0.15),rgba(100,116,255,0.08));border-radius:999px;margin-top:18px;overflow:hidden}
    .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#7c6bff);transition:width 520ms ease}

    footer{padding:18px 28px;background:linear-gradient(180deg,transparent,rgba(250,250,250,0.95));display:flex;justify-content:space-between;align-items:center}
    .meta{font-size:13px;color:var(--muted)}

    /* floating hearts */
    .hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .hearts i{position:absolute;display:block;width:14px;height:14px;background:var(--accent);transform:rotate(45deg);left:50%;top:50%;opacity:0.9;border-radius:2px;box-shadow:0 6px 18px rgba(255,107,129,0.18)}
    .hearts i:before,.hearts i:after{content:'';position:absolute;background:var(--accent);width:14px;height:14px;border-radius:50%;}
    .hearts i:before{top:-8px;left:0}
    .hearts i:after{left:8px;top:0}

    /* small responsive */
    @media (max-width:560px){h1{font-size:28px}.reason{font-size:18px;padding:0 8px}.wrap{padding:12px}}
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <div class="title">
        <h1>For Kristine ❤️</h1>
        <p class="sub">A little website made just for you — click the button and enjoy.</p>
      </div>
      <div>
        <button id="playToggle" class="btn" aria-pressed="false">▶ Play song</button>
      </div>
    </header>

    <main>
      <div class="card">
        <div class="hearts" id="hearts"></div>
        <div id="reasonText" class="reason">Loading...</div>
        <div class="controls" style="display:none;" id="controls">
          <button id="prevBtn" class="ghost">◀ Prev</button>
          <button id="nextBtn" class="btn">Next ▶</button>
        </div>
        <div class="progress" aria-hidden="true">
          <div class="bar" id="bar"></div>
        </div>
      </div>
    </main>

    <footer>
      <div class="meta">10 reasons for you • Made with 💖</div>
      <div class="meta">Open this in Chrome, Firefox, or Edge for best experience</div>
    </footer>
  </div>

  <!-- AUDIO: Replace the src with your uploaded mp3 URL (or leave empty and omit autoplay). -->
  <audio id="bgAudio" loop preload="none">
    <!-- Example: <source src="https://example.com/your-song.mp3" type="audio/mpeg"> -->
  </audio>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    /* ====== CUSTOMIZE ====== */
    const RECIPIENT = 'Kristine';
    const REASONS = [
      "You make every day feel brighter.",
      "Your laugh is my favorite sound.",
      "You always know how to make me smile.",
      "Your kindness inspires me to be better.",
      "I love the little things you do without thinking.",
      "You’re my favorite person to be silly with.",
      "Being with you feels like home.",
      "You support me even when I doubt myself.",
      "I love how you care for the people you love.",
      "Every moment with you becomes a memory I keep forever."
    ];
    const IMAGES = [
      "https://github.com/brtmrtnz/for-kristine/blob/main/16a82d0b-8633-4a36-8658-bb79e0cbaec2.jpg",

    ];
    const AUDIO_SRC = ''; // optional song
    /* ====== end customization ====== */

    document.querySelector('h1').textContent = `For ${RECIPIENT} ❤️`;
    document.querySelector('.sub').textContent = `A little website made just for ${RECIPIENT} — click the button and enjoy.`;

    const reasonEl = document.getElementById('reasonText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const controls = document.getElementById('controls');
    const bar = document.getElementById('bar');
    const hearts = document.getElementById('hearts');
    const playToggle = document.getElementById('playToggle');
    const audio = document.getElementById('bgAudio');

    // --- image element ---
    const img = document.createElement('img');
    img.style.width = '100%';
    img.style.maxHeight = '240px';
    img.style.objectFit = 'cover';
    img.style.borderRadius = '12px';
    img.style.marginBottom = '16px';
    reasonEl.parentElement.insertBefore(img, reasonEl);

    // audio setup
    if (AUDIO_SRC && AUDIO_SRC.trim().length>5){
      const s = document.createElement('source'); s.src = AUDIO_SRC; s.type = 'audio/mpeg';
      audio.appendChild(s);
    } else playToggle.style.display = 'none';

    let idx = 0;
    function showReason(i){
      idx = (i+REASONS.length)%REASONS.length;
      reasonEl.classList.remove('show');
      setTimeout(()=>{
        reasonEl.textContent = REASONS[idx];
        reasonEl.classList.add('show');
      },80);
      if (IMAGES[idx]) img.src = IMAGES[idx];
      const pct = Math.round(((idx+1)/REASONS.length)*100);
      bar.style.width = pct + '%';
    }

    nextBtn.addEventListener('click',()=> showReason(idx+1));
    prevBtn.addEventListener('click',()=> showReason(idx-1));

    controls.style.display = 'flex';
    showReason(0);
    spawnHearts();

    playToggle.addEventListener('click',()=>{
      if (audio.paused){
        audio.play().catch(()=>{});
        playToggle.textContent = '⏸ Pause song';
      } else {
        audio.pause();
        playToggle.textContent = '▶ Play song';
      }
    });

    function spawnHearts(){
      setInterval(()=>{
        const i = document.createElement('i');
        const size = Math.random()*16 + 8;
        i.style.width = size + 'px'; i.style.height = size + 'px';
        i.style.left = (Math.random()*100) + '%';
        i.style.top = (60 + Math.random()*30) + '%';
        i.style.opacity = (Math.random()*0.6)+0.4;
        i.style.transform = 'rotate(45deg) scale(0.6)';
        hearts.appendChild(i);
        const dur = 6000 + Math.random()*4000;
        i.animate([
          {transform: 'translateY(0) scale(0.6)', opacity: i.style.opacity},
          {transform: `translateY(-${250 + Math.random()*200}px) scale(1)`, opacity: 0}
        ],{duration:dur, easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish = ()=> i.remove();
      },800);
    }
  });
</script>

</body>
</html>
